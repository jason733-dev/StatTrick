<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --pitch: #FFF8EA;
  --pitch-line: #F0E2BF;
  --turf-900: #0B2740;
  --turf-700: #1476C4;
  --turf-600: #0E3A5C;
  --turf-500: #3FA3E6;
  --turf-100: #E4F2FC;
  --flare-600: #D6432F;
  --flare-500: #FFC629;
  --flare-100: #FFF3D0;
  --gold-500: #F0B429;
  --gold-100: #FFF3D0;
  --ink: #14202B;
  --ink-60: rgba(20,32,43,0.6);
  --ink-40: rgba(20,32,43,0.4);
  --white: #FFFFFF;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --shadow: 0 1px 2px rgba(11,39,64,0.08);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--pitch);
  color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,.display{
  font-family:'Rajdhani',Impact,'Arial Narrow',sans-serif;
  font-weight:600;
  letter-spacing:0.01em;
  margin:0;
}
h2,h3{
  font-family:'Fredoka',sans-serif;
  font-weight:600;
  letter-spacing:0;
  margin:0;
}
button{font-family:inherit;}
#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--pitch);
  position:relative;
  box-shadow:0 0 40px rgba(18,36,28,0.08);
}
@media(min-width:481px){
  body{background:var(--turf-900);}
}

/* ---------- Header / Scoreboard ---------- */
.topbar{
  background:var(--turf-900);
  color:var(--white);
  padding:14px 18px 12px;
  position:sticky;
  top:0;
  z-index:20;
}
.topbar .crest-row{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:10px;
  margin-bottom:2px;
}
.topbar .logo{
  width:36px;
  height:36px;
  border-radius:50%;
  flex-shrink:0;
  object-fit:cover;
  box-shadow:0 0 0 1.5px rgba(255,255,255,0.25);
}
.topbar .crest-text{display:flex;flex-direction:column;}
.topbar .app-name{
  font-size:10px;
  font-weight:600;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--gold-500);
  line-height:1.2;
}
.topbar .team-name{
  font-family:'Rajdhani',sans-serif;
  font-size:19px;
  font-weight:700;
  letter-spacing:0.02em;
  line-height:1.2;
}
.topbar .club-name{
  font-size:11px;
  color:rgba(255,255,255,0.55);
  font-weight:500;
  margin-top:1px;
}
.scoreboard{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:10px;
  padding:12px 14px;
  background:rgba(255,255,255,0.06);
  border-radius:var(--radius-md);
}
.scoreboard .side{
  flex:1;
  text-align:center;
}
.scoreboard .side .label{
  font-size:11px;
  color:rgba(255,255,255,0.6);
  text-transform:uppercase;
  letter-spacing:0.06em;
  margin-bottom:2px;
}
.scoreboard .side .name{
  font-size:14px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.scoreboard .score{
  font-family:'Rajdhani',sans-serif;
  font-size:36px;
  font-weight:700;
  padding:0 10px;
  min-width:90px;
  text-align:center;
  letter-spacing:0.02em;
}
.scoreboard .score .dash{color:rgba(255,255,255,0.35);font-size:24px;margin:0 4px;}
.clock-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:10px;
  font-size:13px;
  color:rgba(255,255,255,0.75);
}
.clock-row .dot{width:6px;height:6px;border-radius:50%;background:var(--flare-500);}
.clock-row.live .dot{animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}
.clock-time{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:15px;color:var(--white);}

.topbar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.player-badge{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.14);
  padding:4px 12px 4px 4px;
  border-radius:20px;
  flex-shrink:0;
}
.player-badge .num{
  width:26px;height:26px;border-radius:50%;
  background:var(--flare-500);color:var(--turf-900);
  display:flex;align-items:center;justify-content:center;
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;
}
.player-badge .nm{font-size:11.5px;font-weight:600;color:var(--white);max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* Quick stat tiles */
.quickstats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:18px;
}
.stat-tile{
  background:var(--turf-100);
  border:none;
  border-radius:18px;
  padding:12px 4px 10px;
  text-align:center;
}
.stat-tile.assist{background:var(--flare-100);}
.stat-tile.save{background:var(--gold-100);}
.stat-tile.steal{background:#E7EEF3;}
.stat-tile .icon-badge{
  width:32px;height:32px;
  border-radius:50%;
  background:var(--white);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 6px;
  font-size:15px;
  box-shadow:0 1px 2px rgba(11,39,64,0.08);
}
.stat-tile .val{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;color:var(--turf-900);line-height:1;}
.stat-tile .lbl{font-size:9px;color:var(--ink-60);text-transform:uppercase;letter-spacing:0.05em;margin-top:4px;font-weight:600;font-family:'Fredoka',sans-serif;}

/* Mascot */
.mascot-wrap{display:flex;justify-content:center;margin-bottom:10px;}

/* Momentum bar */
.momentum{margin-bottom:20px;}
.momentum-label{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:11.5px;font-weight:600;color:var(--ink-60);margin-bottom:6px;
}
.momentum-label .tag{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;color:var(--turf-900);text-transform:uppercase;letter-spacing:0.03em;}
.momentum-track{height:9px;border-radius:6px;background:var(--pitch-line);overflow:hidden;}
.momentum-fill{
  height:100%;border-radius:6px;
  background:linear-gradient(90deg, var(--turf-700), var(--flare-500));
  transition:width 0.5s ease;
}

/* ---------- Main view ---------- */
main{
  flex:1;
  padding:16px 16px 90px;
  overflow-y:auto;
}
.section-title{
  font-size:12px;
  font-weight:600;
  color:var(--ink-60);
  text-transform:uppercase;
  letter-spacing:0.07em;
  margin:22px 0 10px;
}
.section-title:first-child{margin-top:0;}

/* Setup / kickoff card */
.card{
  background:var(--white);
  border:1px solid var(--pitch-line);
  border-radius:var(--radius-lg);
  padding:20px;
}
.field{margin-bottom:14px;}
.field label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:var(--ink-60);
  margin-bottom:6px;
}
.field input, .field select{
  width:100%;
  padding:12px 14px;
  border:1.5px solid var(--pitch-line);
  border-radius:var(--radius-sm);
  font-size:16px;
  font-family:inherit;
  color:var(--ink);
  background:var(--pitch);
}
.field input:focus, .field select:focus{outline:2px solid var(--turf-500);outline-offset:1px;}
.field input[type="checkbox"]{
  width:16px;height:16px;padding:0;border-radius:4px;flex-shrink:0;accent-color:var(--turf-700);
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:none;
  border-radius:var(--radius-sm);
  font-family:'Fredoka',sans-serif;
  font-weight:600;
  font-size:15px;
  padding:14px 18px;
  cursor:pointer;
  transition:transform 0.08s ease, opacity 0.15s ease;
  width:100%;
}
.btn:active{transform:scale(0.98);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-primary{background:var(--turf-700);color:var(--white);}
.btn-flare{background:var(--flare-500);color:var(--white);}
.btn-gold{background:var(--gold-500);color:var(--turf-900);}
.btn-ghost{background:transparent;color:var(--turf-700);border:1.5px solid var(--turf-700);}
.btn-danger-ghost{background:transparent;color:var(--flare-600);border:1.5px solid var(--flare-100);}
.btn-sm{padding:9px 14px;font-size:13px;width:auto;}

.controls-row{display:flex;gap:10px;margin-top:4px;}
.controls-row .btn{flex:1;}

/* Player grid */
.player-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(74px,1fr));
  gap:10px;
}
.player-chip{
  background:var(--white);
  border:1.5px solid var(--pitch-line);
  border-radius:var(--radius-md);
  padding:10px 6px 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  cursor:pointer;
  transition:all 0.12s ease;
}
.player-chip .num{
  font-family:'Rajdhani',sans-serif;
  font-size:20px;
  font-weight:700;
  width:38px;height:38px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--turf-100);
  color:var(--turf-700);
}
.player-chip .name{
  font-size:10.5px;
  font-weight:600;
  text-align:center;
  color:var(--ink-60);
  line-height:1.2;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.player-chip.selected{
  border-color:var(--flare-500);
  background:var(--flare-100);
}
.player-chip.selected .num{background:var(--flare-500);color:var(--white);}
.player-chip.selected .name{color:var(--flare-600);}

.selected-banner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--flare-100);
  border-radius:var(--radius-sm);
  padding:10px 14px;
  margin-bottom:12px;
  font-size:13.5px;
  font-weight:600;
  color:var(--flare-600);
}
.selected-banner button{
  background:none;border:none;color:var(--flare-600);
  font-size:12px;font-weight:600;text-decoration:underline;cursor:pointer;
}

.admin-banner{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--turf-100);
  border-radius:var(--radius-sm);
  padding:8px 14px;
  margin-bottom:14px;
  font-size:12.5px;
  font-weight:600;
  color:var(--turf-700);
}
.admin-banner button{
  background:none;border:none;color:var(--turf-700);
  font-size:12px;font-weight:600;text-decoration:underline;cursor:pointer;
}
.lock-dot{font-size:9px;vertical-align:1px;}

/* Action grid */
.action-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.action-btn{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px;
  border-radius:var(--radius-md);
  border:none;
  cursor:pointer;
  font-size:14.5px;
  font-weight:600;
  color:var(--white);
  transition:transform 0.08s ease;
}
.action-btn:active{transform:scale(0.97);}
.action-btn .ico{font-size:20px;}
.action-btn.attack{background:var(--turf-700);}
.action-btn.defend{background:var(--turf-600);}
.action-btn.keeper{background:var(--gold-500);color:var(--turf-900);}
.action-grid.disabled{opacity:0.35;pointer-events:none;}

.concede-btn{
  width:100%;
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:14px;
  border-radius:var(--radius-md);
  border:1.5px dashed var(--ink-40);
  background:transparent;
  color:var(--ink-60);
  font-weight:600;
  font-size:14px;
  cursor:pointer;
}

/* Feed */
.feed{list-style:none;margin:0;padding:0;}
.feed li{
  display:flex;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid var(--pitch-line);
}
.feed li:last-child{border-bottom:none;}
.feed .time{
  font-family:'Rajdhani',sans-serif;
  font-size:13px;
  font-weight:600;
  color:var(--ink-40);
  width:44px;
  flex-shrink:0;
  padding-top:1px;
}
.feed .dot-col{width:3px;border-radius:2px;flex-shrink:0;}
.feed .dot-col.attack{background:var(--turf-700);}
.feed .dot-col.defend{background:var(--turf-600);}
.feed .dot-col.keeper{background:var(--gold-500);}
.feed .dot-col.concede{background:var(--ink-40);}
.feed .dot-col.system{background:var(--turf-900);}
.feed .txt{font-size:13.5px;line-height:1.4;}
.feed .txt b{font-weight:700;}
.empty-note{
  color:var(--ink-40);
  font-size:13.5px;
  text-align:center;
  padding:24px 0;
}

/* History list */
.game-row{
  background:var(--white);
  border:1px solid var(--pitch-line);
  border-radius:var(--radius-md);
  padding:6px 6px 6px 16px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:4px;
}
.game-row .row-main{
  flex:1;
  min-width:0;
  padding:8px 0;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.game-row .menu-btn{
  flex-shrink:0;
  background:none;
  border:none;
  color:var(--ink-40);
  font-size:20px;
  font-weight:700;
  line-height:1;
  padding:8px 10px;
  cursor:pointer;
}
.game-row .left .opp{font-weight:600;font-size:14.5px;}
.game-row .left .date{font-size:12px;color:var(--ink-40);margin-top:2px;}
.game-row .right{text-align:right;}
.game-row .right .sc{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:18px;}
.game-row .right .res{font-size:11px;font-weight:700;letter-spacing:0.04em;margin-top:2px;}
.res.win{color:var(--turf-700);}
.res.loss{color:var(--flare-600);}
.res.draw{color:var(--gold-500);}
.res.live{color:var(--flare-500);}
.res.pending{color:var(--ink-40);}

.stat-table{width:100%;border-collapse:collapse;margin-top:6px;}
.stat-table th, .stat-table td{
  text-align:left;
  padding:8px 6px;
  font-size:12.5px;
  border-bottom:1px solid var(--pitch-line);
}
.stat-table th{color:var(--ink-40);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:0.04em;}
.stat-table td.num{text-align:center;}
.stat-table td.name{font-weight:600;}

.summary-box{
  background:var(--turf-100);
  border-radius:var(--radius-md);
  padding:16px;
  font-size:13.5px;
  line-height:1.6;
  color:var(--turf-900);
  white-space:pre-wrap;
}

/* Roster */
.roster-row{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--white);
  border:1px solid var(--pitch-line);
  border-radius:var(--radius-md);
  padding:10px 14px;
  margin-bottom:8px;
}
.roster-row .num{
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;
  width:32px;height:32px;border-radius:50%;
  background:var(--turf-100);color:var(--turf-700);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.roster-row .nm{flex:1;font-weight:600;font-size:14px;}
.roster-row button{
  background:none;border:none;color:var(--ink-40);font-size:12px;font-weight:600;cursor:pointer;
}
.roster-row button:hover{color:var(--flare-600);}

/* Stats tab */
.record-card{
  background:var(--turf-900);
  border-radius:var(--radius-lg);
  padding:20px;
  color:var(--white);
  text-align:center;
  margin-bottom:18px;
}
.record-card .rec-num{font-family:'Rajdhani',sans-serif;font-size:34px;font-weight:700;letter-spacing:0.02em;}
.record-card .rec-lbl{font-size:11px;color:rgba(255,255,255,0.6);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}
.record-row{display:flex;gap:0;margin-bottom:8px;}
.record-row .rec-item{flex:1;}
.record-row .rec-item + .rec-item{border-left:1px solid rgba(255,255,255,0.15);}
.record-goals{font-size:12.5px;color:rgba(255,255,255,0.7);margin-top:6px;}
.leader-row{
  display:flex;align-items:center;gap:12px;
  padding:10px 4px;
  border-bottom:1px solid var(--pitch-line);
}
.leader-row:last-child{border-bottom:none;}
.leader-row .rank{
  width:20px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;color:var(--ink-40);flex-shrink:0;
}
.leader-row .nm{flex:1;font-size:13.5px;font-weight:600;}
.leader-row .lstat{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;color:var(--turf-700);}
.leader-row .lstat span{font-size:10px;color:var(--ink-40);font-weight:600;margin-left:2px;}

/* Bottom nav */
nav.tabbar{
  position:sticky;
  bottom:0;
  background:var(--white);
  border-top:1px solid var(--pitch-line);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom,0);
  z-index:20;
}
nav.tabbar button{
  flex:1;
  border:none;
  background:none;
  padding:11px 4px 9px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  cursor:pointer;
  font-family:'Fredoka',sans-serif;
  color:var(--ink-40);
  font-size:11px;
  font-weight:600;
}
nav.tabbar button .icon{font-size:19px;}
nav.tabbar button.active{color:var(--turf-700);}

/* Misc */
.back-link{
  display:inline-flex;align-items:center;gap:4px;
  color:var(--turf-700);font-weight:600;font-size:13.5px;
  background:none;border:none;cursor:pointer;padding:0 0 14px;
}
.helper-text{font-size:12.5px;color:var(--ink-40);margin-top:6px;line-height:1.5;}
.toast{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:var(--turf-900);
  color:var(--white);
  padding:10px 18px;
  border-radius:24px;
  font-size:13px;
  font-weight:600;
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.2s ease, transform 0.2s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.toast.celebrate{background:var(--flare-500);color:var(--turf-900);font-family:'Fredoka',sans-serif;font-size:14px;}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(18,36,28,0.5);
  display:flex;align-items:flex-end;justify-content:center;z-index:200;
}
.modal-sheet{
  background:var(--white);
  width:100%;max-width:480px;
  border-radius:20px 20px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom,0));
}
.modal-sheet h3{font-size:17px;margin-bottom:8px;}
.modal-sheet p{font-size:13.5px;color:var(--ink-60);line-height:1.5;margin:0 0 18px;}
.modal-actions{display:flex;gap:10px;}
.modal-actions .btn{flex:1;}

.spinner{
  display:inline-block;width:14px;height:14px;
  border:2px solid rgba(255,255,255,0.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 0.7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
</style>

<script>
(function(){
"use strict";
/* Storage backend: shared data goes through our own /api/storage route
   (backed by Firebase Firestore), personal/device-local data uses
   localStorage. Same get/set/delete(key, value, shared) shape as the old
   window.storage API, so nothing else in this file needs to change. */
const S = {
  async get(key, shared){
    if(shared){
      const r = await fetch('/api/storage?key='+encodeURIComponent(key));
      if(!r.ok) throw new Error('not found');
      const data = await r.json();
      return {key, value: data.value, shared};
    }
    const v = localStorage.getItem('st:'+key);
    if(v===null) throw new Error('not found');
    return {key, value:v, shared};
  },
  async set(key, value, shared){
    if(shared){
      const r = await fetch('/api/storage?key='+encodeURIComponent(key), {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({value})
      });
      if(!r.ok) throw new Error('save failed');
      return {key, value, shared};
    }
    localStorage.setItem('st:'+key, value);
    return {key, value, shared};
  },
  async delete(key, shared){
    if(shared){
      await fetch('/api/storage?key='+encodeURIComponent(key), {method:'DELETE'});
    }else{
      localStorage.removeItem('st:'+key);
    }
    return {key, shared};
  }

/* ---------------- Storage helpers ---------------- */
async function getJSON(key, shared, fallback){
  try{
    const r = await S.get(key, shared);
    return r && r.value ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function setJSON(key, shared, value){
  try{
    await S.set(key, JSON.stringify(value), shared);
    return true;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}

function id(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function toast(msg, celebrate){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('celebrate', !!celebrate);
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), celebrate ? 2400 : 1800);
}
function fmtClock(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function fmtDate(d){
  const dt = new Date(d+'T12:00:00');
  return dt.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
}
function currentGame(){ return games.find(g=>g.id===currentGameId) || null; }
function findGame(gid){ return games.find(g=>g.id===gid) || null; }

/* elapsed match seconds for a game right now */
function elapsedSeconds(g){
  let total = g.elapsedBeforeHalf || 0;
  if((g.status==='first_half' || g.status==='second_half') && g.halfStartEpoch){
    total += (Date.now() - g.halfStartEpoch)/1000;
  }
  return total;
}

/* ---------------- Persistence actions ---------------- */
async function persistGames(){ await setJSON('games', true, games); }
async function persistRoster(){ await setJSON('roster', true, roster); }
async function persistCurrent(gid){
  currentGameId = gid;
  try{ await S.set('current-game-id', gid || '', true); }catch(e){}
}

/* ---------------- Stats ---------------- */
function computeStats(g){
  const per = {};
  let bangersGoals=0, opponentGoals=0;
  g.events.forEach(e=>{
    if(e.action==='goal_conceded'){ opponentGoals++; return; }
    if(e.action==='system' || !e.playerId) return;
    const p = per[e.playerId] || (per[e.playerId] = {label:e.playerLabel, goals:0, assists:0, saves:0, steals:0, shots:0});
    if(e.action==='goal'){ p.goals++; bangersGoals++; }
    else if(e.action==='assist') p.assists++;
    else if(e.action==='save') p.saves++;
    else if(e.action==='steal') p.steals++;
    else if(e.action==='shot') p.shots++;
  });
  if(g.scoreOverride){ bangersGoals = g.scoreOverride.for; opponentGoals = g.scoreOverride.against; }
  return {per, bangersGoals, opponentGoals};
}

function computeMomentum(g){
  const evs = g.events.filter(e=>e.action!=='system').slice(-6);
  let score = 0;
  evs.forEach(e=>{
    if(e.action==='goal') score+=3;
    else if(e.action==='assist') score+=1.5;
    else if(e.action==='shot') score+=1;
    else if(e.action==='steal') score+=1;
    else if(e.action==='save') score+=1;
    else if(e.action==='goal_conceded') score-=3;
  });
  const pct = Math.max(6, Math.min(94, Math.round(50 + score*7)));
  let label = 'Steady';
  if(pct>=75) label='Bangers rolling';
  else if(pct>=58) label='Bangers pushing';
  else if(pct<=25) label='Under pressure';
  else if(pct<=42) label='Opponent pushing';
  return {pct, label};
}

function computeSeasonStats(){
  const per = {};
  let wins=0, draws=0, losses=0, played=0, goalsFor=0, goalsAgainst=0;
  games.forEach(g=>{
    const s = computeStats(g);
    Object.entries(s.per).forEach(([pid, st])=>{
      const p = per[pid] || (per[pid] = {label:st.label, goals:0, assists:0, saves:0, steals:0, shots:0});
      p.goals+=st.goals; p.assists+=st.assists; p.saves+=st.saves; p.steals+=st.steals; p.shots+=st.shots;
    });
    if(g.status==='ended'){
      played++;
      goalsFor+=s.bangersGoals; goalsAgainst+=s.opponentGoals;
      if(s.bangersGoals>s.opponentGoals) wins++;
      else if(s.bangersGoals<s.opponentGoals) losses++;
      else draws++;
    }
  });
  return {per, wins, draws, losses, played, goalsFor, goalsAgainst};
}

/* ---------------- AI Summary ---------------- */
async function generateSummary(g){
  genBusy = true; render();
  try{
    const stats = computeStats(g);
    const log = g.events
      .filter(e=>e.action!=='system')
      .map(e=>{
        const m = actionMeta(e.action);
        const half = e.half===2 ? '2nd half' : '1st half';
        const who = e.playerLabel || 'Opposing Team';
        return fmtClock(e.matchSeconds)+' ('+half+') — '+who+': '+m.label;
      }).join('\n');

    const prompt = 'You are writing a short recap of a youth soccer match for the parents of the "Bangers" team (Los Gatos United U12) to read in a group chat.\n\n'+
      'Opponent: '+g.opponent+'\n'+
      'Final score: Bangers '+stats.bangersGoals+' - '+stats.opponentGoals+' '+g.opponent+'\n\n'+
      'Chronological event log (match clock):\n'+log+'\n\n'+
      'Write, in this exact structure with these exact headings:\n'+
      '1. A heading "Game Recap" followed by a warm, specific 2-3 paragraph narrative of how the game unfolded, naming standout players by name and number, in chronological order.\n'+
      '2. A heading "Offensive Stars" with bullet points per player who had a goal, assist, or shot on goal.\n'+
      '3. A heading "Defense & Goalkeeping" with bullet points per player who had a steal or save.\n'+
      'Keep it upbeat and specific to what actually happened — no generic filler. Use the exact player names given. Keep the whole thing under 350 words.';

    const resp = await fetch('/api/summary', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt})
    });
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || 'summary request failed');
    g.aiSummary = (data.text||'').trim() || 'Could not generate a summary — please try again.';
  }catch(e){
    g.aiSummary = 'Something went wrong generating the summary. Please try again.';
  }
  genBusy = false;
  await persistGames();
  render();
}

/* ---------------- CSV export ---------------- */
function exportCSV(g){
  const rows = [['Timestamp','Match Clock','Half','Player','Action']];
  g.events.forEach(e=>{
    const m = actionMeta(e.action);
    rows.push([
      new Date(e.epoch).toLocaleString(),
      fmtClock(e.matchSeconds),
      e.half,
      e.playerLabel || (e.action==='system' ? '—' : 'Opposing Team'),
      e.action==='system' ? e.label : m.label
    ]);
  });
  const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'bangers-vs-'+g.opponent.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+g.date+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* Original hand-drawn team mascot — a friendly lion in a Bangers jersey */
function mascotSVG(size){
  size = size || 80;
  let spikes = '';
  for(let i=0;i<12;i++){
    const a = (i/12)*Math.PI*2;
    const cx = (50+34*Math.cos(a)).toFixed(1);
    const cy = (50+34*Math.sin(a)).toFixed(1);
    spikes += '<circle cx="'+cx+'" cy="'+cy+'" r="11" fill="#FFC629"/>';
  }
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
    spikes+
    '<circle cx="50" cy="46" r="29" fill="#FFE3A8"/>'+
    '<ellipse cx="50" cy="58" rx="13" ry="9" fill="#FFF3D6"/>'+
    '<circle cx="41" cy="42" r="3.4" fill="#0B2740"/>'+

    return '<button data-tab="'+key+'" class="'+(tab===key?'active':'')+'"><span class="icon">'+icon+'</span>'+label+(showLock?' <span class="lock-dot">🔒</span>':'')+'</button>';
  }
  return '<nav class="tabbar">'+
    b('live','⚽','Live',false)+
    b('history','📋','History',false)+
    b('tracker','📝','Stat Tracker',true)+
    b('roster','👥','Roster',true)+
  '</nav>';
}

function renderView(g){
  if(tab==='live') return renderLivePublic(g);
  if(tab==='history') return historyDetailId ? renderGameDetail(findGame(historyDetailId)) : renderHistoryList();
  if(tab==='tracker') return isAdmin ? renderTracker(g) : renderAdminGate('Stat Tracker access');
  if(tab==='roster') return isAdmin ? renderSettings() : renderAdminGate('Roster access');
  return '';
}

/* ---- Live tab ---- */
function quickStatsBlock(g){
  const gs = computeStats(g);
  let totalShots=0, totalSteals=0, totalSaves=0;
  Object.values(gs.per).forEach(p=>{ totalShots+=p.shots; totalSteals+=p.steals; totalSaves+=p.saves; });
  return '<div class="quickstats">'+
    '<div class="stat-tile"><div class="icon-badge">⚽</div><div class="val">'+gs.bangersGoals+'</div><div class="lbl">Goals</div></div>'+
    '<div class="stat-tile assist"><div class="icon-badge">🎯</div><div class="val">'+totalShots+'</div><div class="lbl">Shots</div></div>'+
    '<div class="stat-tile steal"><div class="icon-badge">🛡️</div><div class="val">'+totalSteals+'</div><div class="lbl">Steals</div></div>'+
    '<div class="stat-tile save"><div class="icon-badge">🧤</div><div class="val">'+totalSaves+'</div><div class="lbl">Saves</div></div>'+
  '</div>';
}
function momentumBlock(g){
  const mo = computeMomentum(g);
  return '<div class="momentum"><div class="momentum-label"><span>Match momentum</span><span class="tag">'+mo.label+'</span></div>'+
    '<div class="momentum-track"><div class="momentum-fill" style="width:'+mo.pct+'%;"></div></div></div>';
}

function renderAdminGate(label){
  return '<div class="section-title">'+label+'</div>'+
    '<div class="card">'+
      '<p class="helper-text" style="margin-top:0;margin-bottom:14px;">This area is for the parents tracking live games. Enter your name and the team admin passcode to unlock it on this device.</p>'+
      '<div class="field"><label for="admin-name">Your name</label><input id="admin-name" type="text" placeholder="e.g. Jason"></div>'+
      '<div class="field"><label for="admin-pass">Admin passcode</label><input id="admin-pass" type="password" placeholder="Passcode"></div>'+
      '<button class="btn btn-primary" id="admin-unlock-btn">Unlock</button>'+
    '</div>';
}

function adminBanner(){
  if(!isAdmin) return '';
  return '<div class="admin-banner"><span>Admin'+(adminName?': '+esc(adminName):'')+'</span><button id="lock-admin-btn">lock</button></div>';
}

function renderLivePublic(g){
  if(!g){
    return '<div class="card" style="text-align:center;">'+
      '<div class="mascot-wrap">'+mascotSVG(96)+'</div>'+
      '<h2 style="font-size:19px;margin-bottom:6px;">No live match right now</h2>'+
      '<p class="helper-text" style="margin:0;">Check back during the next Bangers game — stats will show up here in real time once tracking starts.</p>'+
    '</div>';
  }
  if(g.status==='not_started'){
    return '<div class="card" style="text-align:center;">'+
      '<div class="display" style="font-size:15px;margin-bottom:4px;color:var(--ink-60);">'+fmtDate(g.date)+'</div>'+
      '<h2 style="font-size:20px;margin-bottom:6px;">Bangers vs '+esc(g.opponent)+'</h2>'+
      '<p class="helper-text" style="margin:0;">Kick off hasn\'t happened yet — check back shortly.</p>'+
    '</div>';
  }
  let html = quickStatsBlock(g);
  if(g.status!=='half_time') html += momentumBlock(g);
  html += '<div class="section-title">Live feed</div>';
  html += renderFeed(g);
  return html;
}

function renderTracker(g){
  const banner = adminBanner();
  if(!g){
    const today = new Date().toISOString().slice(0,10);
    return banner+'<div class="section-title">New match</div>'+
      '<div class="card">'+
        '<div class="field"><label for="opp-input">Opponent</label><input id="opp-input" type="text" placeholder="e.g. Phantoms"></div>'+
        '<div class="field"><label for="date-input">Date</label><input id="date-input" type="date" value="'+today+'"></div>'+
        '<button class="btn btn-primary" id="create-game-btn">Set up match</button>'+
      '</div>'+
      '<p class="helper-text">Once it is set up you will get a Kick Off button to start the clock. Everyone with this page open shares the same live game.</p>';
  }

  if(g.status==='not_started'){
    return banner+'<div class="card" style="text-align:center;">'+
      '<div class="display" style="font-size:15px;margin-bottom:4px;color:var(--ink-60);">'+fmtDate(g.date)+'</div>'+
      '<h2 style="font-size:22px;margin-bottom:18px;">Bangers vs '+esc(g.opponent)+'</h2>'+
      '<button class="btn btn-flare" id="kickoff-btn">Kick off</button>'+
      '<button class="btn btn-ghost" id="cancel-setup-btn" style="margin-top:10px;">Cancel match</button>'+
    '</div>';
  }

  if(g.status==='ended'){
    return banner+renderGameDetail(g, true);
  }

  const isHalftime = g.status==='half_time';
  const player = roster.find(p=>p.id===selectedPlayerId);

  let html = banner;
  html += '<div class="controls-row">';
  if(isHalftime){
    html += '<button class="btn btn-primary" id="start2-btn">Start 2nd half</button>';
  }else{
    html += '<button class="btn btn-ghost" id="undo-btn">↩ Undo last</button>';
    if(g.status==='first_half') html += '<button class="btn btn-ghost" id="halftime-btn">Half-time</button>';
    if(g.status==='second_half') html += '<button class="btn btn-flare" id="endgame-btn">End game</button>';
  }
  html += '</div>';

  html += quickStatsBlock(g);
  html += momentumBlock(g);

  if(!isHalftime){
    html += '<div class="section-title">Select player</div>';
    if(player){
      html += '<div class="selected-banner"><span>Logging for #'+player.number+' '+esc(player.name)+'</span><button id="clear-player-btn">change</button></div>';
    }
    html += '<div class="player-grid">';
    roster.forEach(p=>{
      html += '<div class="player-chip'+(p.id===selectedPlayerId?' selected':'')+'" data-player="'+p.id+'">'+
        '<div class="num">'+p.number+'</div><div class="name">'+esc(shortName(p.name))+'</div></div>';
    });
    html += '</div>';

    html += '<div class="section-title">Log action'+(player?'':' (pick a player first)')+'</div>';
    html += '<div class="action-grid'+(player?'':' disabled')+'">';
    ACTIONS.forEach(a=>{
      html += '<button class="action-btn '+a.cat+'" data-action="'+a.key+'"><span class="ico">'+a.icon+'</span>'+a.label+'</button>';
    });
    html += '</div>';

    html += '<div class="section-title">Team</div>';
    html += '<button class="concede-btn" id="concede-btn">🥅 Opponent scored — log goal conceded</button>';
  }

  html += '<div class="section-title">Live feed</div>';
  html += renderFeed(g);
  return html;
}

function shortName(n){
  return n.length>14 ? n.split(' ')[0] : n;
}

function renderFeed(g){
  const evts = g.events.slice().reverse();
  if(evts.length===0) return '<p class="empty-note">No events logged yet.</p>';
  let html = '<ul class="feed">';
  evts.forEach(e=>{
    const m = actionMeta(e.action);
    const who = e.action==='system' ? '' : ('<b>'+esc(e.playerLabel)+'</b> — ');
    const label = e.action==='system' ? e.label : m.label;
    html += '<li><div class="time">'+fmtClock(e.matchSeconds)+'</div><div class="dot-col '+m.cat+'"></div><div class="txt">'+who+label+'</div></li>';
  });
  html += '</ul>';
  return html;
}

/* ---- History tab ---- */
function renderHistoryList(){
  const sorted = games.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'') || 0);
  if(sorted.length===0){
    return '<p class="empty-note">No matches logged yet. Start one from the Live tab.</p>';
  }
  let html = '<div class="section-title">Matches</div>';
  sorted.forEach(g=>{
    const stats = computeStats(g);
    let resClass = 'pending', resLabel = '—';
    if(g.status==='ended'){
      if(stats.bangersGoals>stats.opponentGoals){resClass='win';resLabel='WIN';}
      else if(stats.bangersGoals<stats.opponentGoals){resClass='loss';resLabel='LOSS';}
      else {resClass='draw';resLabel='DRAW';}
    } else if(g.status!=='not_started'){
      resClass='live'; resLabel='LIVE';
    }
    html += '<div class="game-row">'+
      '<div class="row-main" data-game="'+g.id+'">'+
        '<div class="left"><div class="opp">vs '+esc(g.opponent)+'</div><div class="date">'+fmtDate(g.date)+'</div></div>'+
        '<div class="right"><div class="sc">'+stats.bangersGoals+'–'+stats.opponentGoals+'</div><div class="res '+resClass+'">'+resLabel+'</div></div>'+
      '</div>'+
      '<button class="menu-btn" data-menu="'+g.id+'" aria-label="Match options">⋮</button>'+
    '</div>';
  });
  return html;
}

function renderGameDetail(g, embedded){
  if(!g) return '<p class="empty-note">Match not found.</p>';
  const stats = computeStats(g);
  let html = '';
  if(!embedded){
    html += '<button class="back-link" id="back-to-list">← All matches</button>';
  }
  const isWin = g.status==='ended' && stats.bangersGoals>stats.opponentGoals;
  html += '<div class="card" style="text-align:center;margin-bottom:18px;">'+
    (isWin ? '<div class="mascot-wrap">'+mascotSVG(64)+'</div>' : '')+
    '<div style="font-size:12.5px;color:var(--ink-40);margin-bottom:4px;">'+fmtDate(g.date)+'</div>'+
    '<h2 style="font-size:24px;">Bangers '+stats.bangersGoals+' – '+stats.opponentGoals+' '+esc(g.opponent)+'</h2>'+
  '</div>';

  const per = Object.values(stats.per).sort((a,b)=> (b.goals+b.assists+b.shots+b.steals+b.saves)-(a.goals+a.assists+a.shots+a.steals+a.saves));
  if(per.length){
    html += '<div class="section-title">Player stats</div>';
    html += '<table class="stat-table"><thead><tr><th>Player</th><th class="num">G</th><th class="num">A</th><th class="num">Sh</th><th class="num">St</th><th class="num">Sv</th></tr></thead><tbody>';
    per.forEach(p=>{
      html += '<tr><td class="name">'+esc(p.label)+'</td><td class="num">'+p.goals+'</td><td class="num">'+p.assists+'</td><td class="num">'+p.shots+'</td><td class="num">'+p.steals+'</td><td class="num">'+p.saves+'</td></tr>';
    });
    html += '</tbody></table>';
  }

  html += '<div class="section-title">AI game summary</div>';
  if(g.aiSummary){
    html += '<div class="summary-box">'+esc(g.aiSummary)+'</div>';
    if(isAdmin){
      html += '<button class="btn btn-ghost btn-sm" style="margin-top:10px;" id="regen-summary-btn" '+(genBusy?'disabled':'')+'>'+(genBusy?'<span class="spinner"></span> Working…':'Regenerate summary')+'</button>';
    }
  }else if(g.status==='ended'){
    html += '<button class="btn btn-gold" id="gen-summary-btn" '+(genBusy?'disabled':'')+'>'+(genBusy?'<span class="spinner"></span> Writing recap…':'✨ Generate AI summary')+'</button>';
  }else{
    html += '<p class="empty-note">Available once the match has ended.</p>';
  }

  html += '<div class="section-title">Event log</div>';
  html += renderFeed(g);

  html += '<div class="section-title">Match tools</div>';
  html += '<div class="controls-row">';
  html += '<button class="btn btn-ghost btn-sm" id="export-csv-btn" style="flex:1;">Export CSV</button>';
  if(isAdmin && g.status!=='ended'){
    html += '<button class="btn btn-ghost btn-sm" id="resume-game-btn" style="flex:1;">Resume in Stat Tracker</button>';
  }
  html += '</div>';
  if(isAdmin){
    html += '<button class="btn btn-danger-ghost btn-sm" id="delete-game-btn" style="margin-top:10px;width:100%;">Delete this match</button>';
  }

  return html;
}

/* ---- Roster tab ---- */
function renderStats(){
  const s = computeSeasonStats();
  let html = '<div class="record-card">'+
    '<div class="record-row">'+
      '<div class="rec-item"><div class="rec-num">'+s.wins+'</div><div class="rec-lbl">Wins</div></div>'+
      '<div class="rec-item"><div class="rec-num">'+s.draws+'</div><div class="rec-lbl">Draws</div></div>'+
      '<div class="rec-item"><div class="rec-num">'+s.losses+'</div><div class="rec-lbl">Losses</div></div>'+
    '</div>'+
    '<div class="record-goals">'+s.goalsFor+' goals for · '+s.goalsAgainst+' against · '+s.played+' matches played</div>'+
  '</div>';

  const per = Object.values(s.per);
  const totalGoals = per.reduce((a,p)=>a+p.goals,0);
  const totalAssists = per.reduce((a,p)=>a+p.assists,0);
  const totalSaves = per.reduce((a,p)=>a+p.saves,0);
  const totalSteals = per.reduce((a,p)=>a+p.steals,0);
  html += '<div class="quickstats">'+
    '<div class="stat-tile"><div class="val">'+totalGoals+'</div><div class="lbl">Goals</div></div>'+
    '<div class="stat-tile assist"><div class="val">'+totalAssists+'</div><div class="lbl">Assists</div></div>'+
    '<div class="stat-tile steal"><div class="val">'+totalSteals+'</div><div class="lbl">Steals</div></div>'+
    '<div class="stat-tile save"><div class="val">'+totalSaves+'</div><div class="lbl">Saves</div></div>'+
  '</div>';

  if(per.length===0){
    html += '<p class="empty-note">Stats fill in once a match is logged.</p>';
    return html;
  }

  function leaderboard(title, key, suffix){
    const ranked = per.filter(p=>p[key]>0).sort((a,b)=>b[key]-a[key]).slice(0,5);
    if(ranked.length===0) return '';
    let h = '<div class="section-title">'+title+'</div><div class="card">';
    ranked.forEach((p,i)=>{
      h += '<div class="leader-row"><span class="rank">'+(i+1)+'</span><span class="nm">'+esc(p.label)+'</span><span class="lstat">'+p[key]+'<span>'+suffix+'</span></span></div>';
    });
    h += '</div>';
    return h;
  }
  html += leaderboard('Top scorers', 'goals', 'G');
  html += leaderboard('Top playmakers', 'assists', 'A');
  html += leaderboard('Top defenders', 'steals', 'ST');
  html += leaderboard('Top keepers', 'saves', 'SV');
  return html;
}

function renderSettings(){
  let html = adminBanner();
  html += '<div class="section-title">Bangers roster</div>';
  const sorted = roster.slice().sort((a,b)=>a.number-b.number);
  sorted.forEach(p=>{
    html += '<div class="roster-row"><div class="num">'+p.number+'</div><div class="nm">'+esc(p.name)+'</div><button data-edit-player="'+p.id+'">Edit</button><button data-remove-player="'+p.id+'">Remove</button></div>';
  });
  html += '<div class="section-title">Add player</div>';
  html += '<div class="card">'+
    '<div class="field"><label for="add-num">Number</label><input id="add-num" type="number" min="0" max="99" placeholder="7"></div>'+
    '<div class="field"><label for="add-name">Name</label><input id="add-name" type="text" placeholder="Full name"></div>'+
    '<button class="btn btn-primary" id="add-player-btn">Add to roster</button>'+
  '</div>';
  html += '<div class="section-title">Admin passcode</div>';
  html += '<div class="card">'+
    '<p class="helper-text" style="margin-top:0;">Whoever knows this passcode (plus any name) can unlock Stat Tracker and Roster on their own device. Change it any time — it does not affect anyone already unlocked.</p>'+
    '<div class="field"><label for="passcode-input">Passcode</label><input id="passcode-input" type="text" value="'+esc(adminPasscode)+'"></div>'+
    '<button class="btn btn-ghost" id="save-passcode-btn">Save passcode</button>'+
  '</div>';
  html += '<div class="section-title">About</div>'+
    '<p class="helper-text">StaTrick for the Bangers — Los Gatos United U12. Live and History are open to anyone with this link; Stat Tracker and Roster are admin-only.</p>';
  return html;
}

/* ---------------- Clock ticker ---------------- */
function manageClock(g){
  if(clockTimer){ clearInterval(clockTimer); clockTimer = null; }
  if(g && (tab==='live'||tab==='tracker') && (g.status==='first_half' || g.status==='second_half')){
    clockTimer = setInterval(()=>{
      const el = document.getElementById('clock-time');
      if(el) el.textContent = fmtClock(elapsedSeconds(g));
    }, 1000);
  }
}

/* ---------------- Events ---------------- */
function bindEvents(g){
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = ()=>{ tab = el.dataset.tab; historyDetailId=null; render(); };
  });

  const unlockBtn = document.getElementById('admin-unlock-btn');
  if(unlockBtn) unlockBtn.onclick = ()=>{
    const name = document.getElementById('admin-name').value;
    const pass = document.getElementById('admin-pass').value;
    unlockAdmin(name, pass);
  };
  const lockBtn = document.getElementById('lock-admin-btn');
  if(lockBtn) lockBtn.onclick = ()=> lockAdmin();
  const savePassBtn = document.getElementById('save-passcode-btn');
  if(savePassBtn) savePassBtn.onclick = async ()=>{
    const val = document.getElementById('passcode-input').value.trim();
    if(!val){ toast('Passcode cannot be empty'); return; }
    adminPasscode = val;
    await setJSON('admin-passcode', true, val);
    toast('Passcode saved');
  };

  // Live: create game
  const createBtn = document.getElementById('create-game-btn');
  if(createBtn) createBtn.onclick = ()=>{
    const opp = document.getElementById('opp-input').value.trim() || 'Opponent';
    const date = document.getElementById('date-input').value || new Date().toISOString().slice(0,10);
    createGame(opp, date);
  };

  const kickoffBtn = document.getElementById('kickoff-btn');
  if(kickoffBtn) kickoffBtn.onclick = ()=> kickoff(g);

  const cancelSetupBtn = document.getElementById('cancel-setup-btn');
  if(cancelSetupBtn) cancelSetupBtn.onclick = async ()=>{
    const ok = await confirmModal('Cancel this match?', 'This will remove the match you just set up.', 'Cancel match');
    if(ok) deleteGame(g.id);
  };

  const halftimeBtn = document.getElementById('halftime-btn');
  if(halftimeBtn) halftimeBtn.onclick = ()=> halftime(g);

  const start2Btn = document.getElementById('start2-btn');
  if(start2Btn) start2Btn.onclick = ()=> startSecondHalf(g);

  const endBtn = document.getElementById('endgame-btn');
  if(endBtn) endBtn.onclick = async ()=>{
    const ok = await confirmModal('End the game?', 'This locks the event log and moves the match to History, where you can generate the AI summary.', 'End game');
    if(ok) endGame(g);
  };

  const undoBtn = document.getElementById('undo-btn');
  if(undoBtn) undoBtn.onclick = ()=> undoLast(g);

  document.querySelectorAll('[data-player]').forEach(el=>{
    el.onclick = ()=>{
      const pid = el.dataset.player;
      selectedPlayerId = (selectedPlayerId===pid) ? null : pid;
      render();
    };
  });
  const clearPlayerBtn = document.getElementById('clear-player-btn');
  if(clearPlayerBtn) clearPlayerBtn.onclick = ()=>{ selectedPlayerId=null; render(); };

  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = ()=>{
      const player = roster.find(p=>p.id===selectedPlayerId);
      if(!player) return;
      const action = el.dataset.action;
      logEvent(g, action, player);
      if(action==='goal'){
        toast('⚡🥅 GOAL! #'+player.number+' '+player.name, true);
      }else{
        toast('Logged: '+el.textContent.trim());
      }
    };
  });

  const concedeBtn = document.getElementById('concede-btn');
  if(concedeBtn) concedeBtn.onclick = ()=>{
    logEvent(g, 'goal_conceded', null);
    toast('Logged: Goal conceded');
  };

  // History
  document.querySelectorAll('[data-game]').forEach(el=>{
    el.onclick = ()=>{ historyDetailId = el.dataset.game; render(); };
  });
  document.querySelectorAll('[data-menu]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); matchMenuModal(el.dataset.menu); };
  });
  const backBtn = document.getElementById('back-to-list');
  if(backBtn) backBtn.onclick = ()=>{ historyDetailId=null; render(); };

  const genBtn = document.getElementById('gen-summary-btn');
  if(genBtn) genBtn.onclick = ()=> generateSummary(historyDetailId?findGame(historyDetailId):g);
  const regenBtn = document.getElementById('regen-summary-btn');
  if(regenBtn) regenBtn.onclick = ()=> generateSummary(historyDetailId?findGame(historyDetailId):g);

  const exportBtn = document.getElementById('export-csv-btn');
  if(exportBtn) exportBtn.onclick = ()=> exportCSV(historyDetailId?findGame(historyDetailId):g);

  const resumeBtn = document.getElementById('resume-game-btn');
  if(resumeBtn) resumeBtn.onclick = async ()=>{
    await persistCurrent(historyDetailId);
    tab='tracker'; historyDetailId=null; render();
  };

  const deleteBtn = document.getElementById('delete-game-btn');
  if(deleteBtn) deleteBtn.onclick = async ()=>{
    const target = historyDetailId || (g?g.id:null);
    const ok = await confirmModal('Delete this match?', 'This permanently removes its event log and summary for everyone.', 'Delete');
    if(ok) deleteGame(target);
  };

  // Roster
  const addPlayerBtn = document.getElementById('add-player-btn');
  if(addPlayerBtn) addPlayerBtn.onclick = async ()=>{
    const num = parseInt(document.getElementById('add-num').value,10);
    const name = document.getElementById('add-name').value.trim();
    if(!name || isNaN(num)){ toast('Enter a number and name'); return; }
    roster.push({id:id(), number:num, name:name});
    await persistRoster();
    render();
  };
  document.querySelectorAll('[data-remove-player]').forEach(el=>{
    el.onclick = async ()=>{
      const ok = await confirmModal('Remove player?', 'This removes them from the roster picker. Past logged events keep their name.', 'Remove');
      if(ok){
        roster = roster.filter(p=>p.id!==el.dataset.removePlayer);
        await persistRoster();
        render();
      }
    };
  });
  document.querySelectorAll('[data-edit-player]').forEach(el=>{
    el.onclick = async ()=>{
      const p = roster.find(x=>x.id===el.dataset.editPlayer);
      if(!p) return;
      const newName = prompt('Player name', p.name);
      if(newName===null) return;
      const newNumRaw = prompt('Jersey number', p.number);
      if(newNumRaw===null) return;
      const newNum = parseInt(newNumRaw,10);
      p.name = newName.trim() || p.name;
      if(!isNaN(newNum)) p.number = newNum;
      await persistRoster();
      render();
    };
  });
}

/* ---------------- Boot ---------------- */
loadAll();
pollTimer = setInterval(refreshFromStorage, 5000);

})();
</script>
